version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 2
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: weekly
    day: sunday
    time: "10:00"
    timezone: Etc/UCT
  reviewers:
  - matz3
  - flovogt
  versioning-strategy: increase
  cooldown:
    default-days: 2
  ignore:
    # We won't upgrade mime and instead want to remove it as per CPOUI5FOUNDATION-882
    - dependency-name: "mime"
      update-types: ["version-update:semver-major"]
    # eslint@10 requires node ^20.19.0 || ^22.13.0 || >=24
    - dependency-name: "eslint"
      update-types: ["version-update:semver-major"]
    - dependency-name: "@eslint/js"
      update-types: ["version-update:semver-major"]
